name: "blame"
version: "0.1.0"
usage: "helm blame RELEASE [KEY] [flags]"
description: "Show the per-key history of a release's values across revisions (like git blame, for Helm values)"
command: "$HELM_PLUGIN_DIR/bin/helm-blame"
ignoreFlags: false
hooks:
  install: "$HELM_PLUGIN_DIR/scripts/install.sh"
  update: "$HELM_PLUGIN_DIR/scripts/install.sh"
